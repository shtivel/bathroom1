[project]
name = "bathroom-grader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Stream app log records live to the terminal while tests run (in addition to the
# per-run file in logs/, set up in conftest.py).
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
# Auto-generated migration snapshots - not hand-written, so not held to our style rules.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. are designed to be used as argument defaults;
# Starlette evaluates them lazily per-request, so this isn't the mutable-default bug B008 guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"
